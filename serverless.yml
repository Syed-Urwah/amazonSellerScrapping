service: amazon-scraping
frameworkVersion: '3'
configValidationMode: error
useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

package:
  patterns:
    - 'src/geo/*.sqlite'
    - 'src/forms/**/*.pdf'


provider:
  name: aws
  runtime: nodejs14.x
  deploymentMethod: direct
  region: us-east-1
  environment:
    AMAZON_EMAIL: ${env:AMAZON_EMAIL}
    AMAZON_PASSWORD: ${env:AMAZON_PASSWORD}

custom:
  esbuild:
    external:
      - better-sqlite3
      - spatialite
      - 'chrome-aws-lambda'
      - 'puppeteer-core'
      - 'puppeteer'
      - 'puppeteer-extra'
      - 'puppeteer-extra-plugin-stealth'
      - 'puppeteer-extra-plugin-recaptcha'
    bundle: true
    minify: false
#    watch:
#      pattern: 'src/**/*.ts'


functions:
  getReport:
    handler: src/scraper/seller/getReportDocument.handler
    runtime: nodejs14.x
    timeout: 900
    memorySize: 1024
    layers:
      - arn:aws:lambda:us-east-1:764866452798:layer:chrome-aws-lambda:34
    events:
      - httpApi:
          path: /scraper/seller/getReport
          method: POST
  createReport:
    handler: src/scraper/seller/createRepositoryReport.handler
    runtime: nodejs14.x
    timeout: 900
    memorySize: 1024
    layers:
      - arn:aws:lambda:us-east-1:764866452798:layer:chrome-aws-lambda:34
    events:
      - httpApi:
          path: /scraper/seller/createReport
          method: POST
  getOnlyReport:
    handler: src/scraper/seller/getRepositoryReport.handler
    runtime: nodejs14.x
    timeout: 900
    memorySize: 1024
    layers:
      - arn:aws:lambda:us-east-1:764866452798:layer:chrome-aws-lambda:34
    events:
      - httpApi:
          path: /scraper/seller/getOnlyReport
          method: POST
